<section class="posts">
    <h2>Postagens Recentes</h2>
    <div class="post-grid">
      <div class="post-card" *ngFor="let post of posts">
        <h3>{{ post.title }}</h3>
        <p class="desc">{{ post.description }}</p>
        <p class="meta">Por {{ post.author }} • {{ post.date }}</p>
      </div>
    </div>
  </section>
