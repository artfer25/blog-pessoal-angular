<div *ngIf="mostrar" class="modal">
  <div class="modal-content">
    <h2>Login</h2>

    <label for="username">Usuário:</label>
    <input id="username" type="text" [(ngModel)]="username" />

    <label for="password">Senha:</label>
    <input id="password" type="password" [(ngModel)]="password" />

    <div class="actions">
      <button class="btn primary" (click)="login()">Entrar</button>
      <button class="btn secondary" (click)="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>
