<div *ngIf="mostrar" class="modal">
  <div class="modal-content">
    <h2>Login</h2>

    <label>Usuário:</label>
    <input type="text" [(ngModel)]="username" />

    <label>Senha:</label>
    <input type="password" [(ngModel)]="password" />

    <button (click)="login()">Entrar</button>
    <button (click)="fecharModal()">Cancelar</button>
  </div>
</div>
