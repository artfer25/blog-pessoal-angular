<section class="posts-page">
    <h1>Postagens do Brainstorm</h1>
    <p>Aqui você encontra todas as publicações do nosso blog. Clique em uma para ler mais.</p>
    <input
    type="text"
    [(ngModel)]="filtroTitulo"
    placeholder="Buscar por título..."
    class="search-bar"
  />
    <div class="post-list">
      <div class="post-card" *ngFor="let post of posts | filterByTitle:filtroTitulo">
        <h3>{{ post.title }}</h3>
        <p>{{ post.summary }}</p>
        <span class="author">Autor: {{ post.author }}</span>
        <span class="date">{{ post.date }}</span>
      </div>
      
    </div>
  </section>
